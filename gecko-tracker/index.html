<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gecko Log</title>
<meta name="description" content="Meals, sheds, weigh-ins and tank checks for your leopard gecko.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gecko Log">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/*
  Gecko Log design tokens.
  Palette: skin #F5C242 (the gecko's yellow, used as a field and on data), spot #231B14 (ink, the gecko's spots),
  ground #FFFFFF, surface #F3F3F1 (neutral tone step), muted #5E5B57. Status: green #247B50, red #B42318.
  One typeface: Bricolage Grotesque. Spacing on a 4px base, one gap of 16px.
*/
:root{
  --ground:#ffffff; --surface:#f3f3f1; --raised:#ffffff; --active:#e9e8e5;
  --border:#e6e5e1; --rule:#efeeeb; --control:#cfcdc8;
  --text:#231b14; --muted:#5e5b57;
  --skin:#f5c242; --skin-ink:#231b14; --spot:#231b14; --skin-soft:#fbe7b0;
  --primary:#231b14; --on-primary:#ffffff;
  --positive:#247b50; --negative:#b42318; --warning:#92400e;
  --pill-pos-bg:#dcfae5; --pill-pos-ink:#04250e; --pill-neg-bg:#fdecea; --pill-neg-ink:#7a1d14;
  --pill-warn-bg:#fff4d6; --pill-warn-ink:#7a3a06; --pill-neu-bg:#efeeeb; --pill-neu-ink:#3d3a36;
  --grid:#e7e6e2; --scrim:rgba(20,16,12,.48);
  --r-card:20px; --r-row:14px; --r-ctl:999px;
  --pad:20px; --side:16px; --navh:64px; --ctl:44px;
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --t-fast:120ms; --t-mid:220ms; --t-sheet:360ms;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121110; --surface:#1d1c1a; --raised:#25231f; --active:#2c2a27;
    --border:#2a2825; --rule:#22201e; --control:#4a4742;
    --text:#f4f1ec; --muted:#b6b0a8;
    --skin:#f2bd3b; --skin-soft:#3b3020;
    --primary:#f5f5f5; --on-primary:#121110;
    --positive:#3fc07a; --negative:#f06a5c; --warning:#f2a845;
    --pill-pos-bg:#172a1d; --pill-pos-ink:#3fc07a; --pill-neg-bg:#331b18; --pill-neg-ink:#f58a7e;
    --pill-warn-bg:#33260f; --pill-warn-ink:#f2b45c; --pill-neu-bg:#262421; --pill-neu-ink:#cfc9c1;
    --grid:#2b2926; --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121110; --surface:#1d1c1a; --raised:#25231f; --active:#2c2a27;
  --border:#2a2825; --rule:#22201e; --control:#4a4742;
  --text:#f4f1ec; --muted:#b6b0a8;
  --skin:#f2bd3b; --skin-soft:#3b3020;
  --primary:#f5f5f5; --on-primary:#121110;
  --positive:#3fc07a; --negative:#f06a5c; --warning:#f2a845;
  --pill-pos-bg:#172a1d; --pill-pos-ink:#3fc07a; --pill-neg-bg:#331b18; --pill-neg-ink:#f58a7e;
  --pill-warn-bg:#33260f; --pill-warn-ink:#f2b45c; --pill-neu-bg:#262421; --pill-neu-ink:#cfc9c1;
  --grid:#2b2926; --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ground)}
/* Never let the page slide sideways on phones (iOS Safari pans the page if anything pokes out). */
html,body{overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y}
@supports (overflow-x:clip){html,body{overflow-x:clip}}
@media (pointer: fine){html{overscroll-behavior:none}}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;font-weight:400;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:100dvh}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--primary);color:var(--on-primary);padding:10px 14px;border-radius:10px}
.skip:focus{top:8px}

.app{max-width:560px;margin:0 auto;padding:0 var(--side) calc(var(--navh) + env(safe-area-inset-bottom) + 40px)}
.app:focus{outline:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;margin-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.who{display:flex;gap:8px}
.who button{width:36px;height:36px;border-radius:50%;padding:0;position:relative;transition:transform var(--t-fast) var(--ease)}
.who button::after{content:"";position:absolute;inset:-4px}
.who button:active{transform:scale(.92)}
.who button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--text)}
.av{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--skin)}
.av img,.av svg{width:100%;height:100%;object-fit:cover;display:block}

.title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:12px 0 20px}
.title h1{font-size:30px;line-height:1.05}
.title .sub{font-size:15px;color:var(--muted);margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--ctl);padding:0 18px;border-radius:var(--r-ctl);
  font-weight:600;font-size:15px;white-space:nowrap;transition:transform var(--t-fast) var(--ease),background-color var(--t-fast) linear,opacity var(--t-fast) linear}
.btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{opacity:.88}
.btn-quiet{background:var(--surface);color:var(--text)}
.btn-quiet:hover{background:var(--active)}
.btn-danger{background:var(--pill-neg-bg);color:var(--pill-neg-ink)}
.btn-wide{width:100%}
.link{color:var(--text);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;padding:10px 0}
.link:hover{text-decoration-thickness:2.5px}

/* the skin: gecko-yellow field, every spot a meal */
.skin{background:var(--skin);color:var(--skin-ink);margin:4px calc(-1 * var(--side)) 0;padding:24px var(--side) 18px}
@media (min-width:592px){.skin{margin-left:0;margin-right:0;border-radius:var(--r-card)}}
.skin-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.skin h1{font-size:46px;line-height:.95;letter-spacing:-.04em;font-weight:800;overflow-wrap:anywhere}
.skin .finding{font-size:17px;line-height:1.35;margin-top:10px;max-width:30ch;font-weight:500}
.portrait{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--skin-soft);flex:none;box-shadow:0 0 0 3px var(--skin-ink);transition:transform var(--t-fast) var(--ease)}
.portrait:active{transform:scale(.95)}
.portrait img,.portrait svg{width:100%;height:100%;object-fit:cover;display:block}
.meals{margin-top:22px}
.meals-grid{display:grid;grid-template-columns:repeat(14,1fr);gap:2px;align-items:end}
.meal{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;border-radius:10px;min-height:52px;justify-content:flex-end;
  transition:background-color var(--t-fast) linear}
.meal svg{width:100%;max-width:26px;height:26px;overflow:visible}
.meal .d{font-size:11px;line-height:1;font-weight:600;opacity:.72}
.meal[aria-pressed="true"]{background:rgba(35,27,20,.13)}
.meal.today .d{opacity:1;font-weight:800}
.meal-say{margin-top:10px;font-size:14px;font-weight:500;min-height:20px}
.spot-in{animation:spotIn 560ms var(--ease) both}
@keyframes spotIn{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* log buttons: "Log a meal" full width, then the rest in a 3-column grid, so nothing scrolls sideways */
.do{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 0}
.do .btn{padding:0 10px;min-width:0}
.do .btn-primary{grid-column:1/-1}

.sec{margin-top:32px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 10px;min-height:32px}
.sec-head h2{font-size:19px}
.panel{background:var(--surface);border-radius:var(--r-card);padding:8px}

.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;min-height:60px;padding:10px 14px;background:var(--raised);border-radius:var(--r-row);width:100%;
  transition:transform var(--t-fast) var(--ease)}
button.row:active{transform:scale(.985)}
.row .t{display:block;font-weight:600;font-size:15px;line-height:1.25}
.row .s{display:block;font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex:none;white-space:nowrap;font-size:12px;font-weight:600;line-height:1;padding:6px 10px;border-radius:999px}
.pill.pos{background:var(--pill-pos-bg);color:var(--pill-pos-ink)}
.pill.neg{background:var(--pill-neg-bg);color:var(--pill-neg-ink)}
.pill.warn{background:var(--pill-warn-bg);color:var(--pill-warn-ink)}
.pill.neu{background:var(--pill-neu-bg);color:var(--pill-neu-ink)}

.notice{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 16px;border-radius:var(--r-row);margin-top:12px}
.notice.act{grid-template-columns:auto 1fr auto;align-items:center}
.notice.neg{background:var(--pill-neg-bg);color:var(--pill-neg-ink)}
.notice.warn{background:var(--pill-warn-bg);color:var(--pill-warn-ink)}
.notice.pos{background:var(--pill-pos-bg);color:var(--pill-pos-ink)}
.notice svg{width:20px;height:20px;margin-top:1px}
.notice b{display:block;font-weight:700}
.notice p{font-size:14px;margin-top:2px}
.notice .btn{height:36px;padding:0 14px}

.figs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.fig{padding:16px var(--pad) 18px;min-width:0}
.fig:nth-child(odd){box-shadow:inset -1px 0 0 var(--border)}
.fig:nth-child(n+3){box-shadow:inset 0 1px 0 var(--border)}
.fig:nth-child(3){box-shadow:inset 0 1px 0 var(--border),inset -1px 0 0 var(--border)}
.fig .k{font-size:13px;color:var(--muted);font-weight:500}
.fig .v{font-size:28px;line-height:1.1;margin-top:4px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.fig .v small{font-size:15px;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:3px}
.fig .c{font-size:13px;margin-top:4px;color:var(--muted)}
.fig .c.pos{color:var(--positive)} .fig .c.neg{color:var(--negative)}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{flex:none;height:40px;padding:0 14px;border-radius:999px;background:var(--surface);font-weight:600;font-size:14px;transition:background-color var(--t-fast) linear}
.chip:hover{background:var(--active)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.day{font-size:14px;font-weight:600;color:var(--muted);margin:22px 4px 8px}
.list{background:var(--surface);border-radius:var(--r-card);padding:4px}
.entry{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:start;padding:12px 14px;width:100%;min-height:56px;border-radius:var(--r-row);transition:background-color var(--t-fast) linear}
.entry+.entry{box-shadow:inset 0 1px 0 var(--border)}
.entry:hover{background:var(--active)}
.entry .time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.entry .t{display:block;font-weight:600;font-size:15px;line-height:1.3}
.entry .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.empty{background:var(--surface);border-radius:var(--r-card);padding:20px;color:var(--muted);font-size:15px}
.empty b{color:var(--text);display:block;font-size:16px;margin-bottom:4px}

.chart{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--control);stroke-width:1.5}
.chart .tick{fill:var(--muted);font-size:11px;font-family:var(--font);font-variant-numeric:tabular-nums}
.chart .line{fill:none;stroke:var(--text);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--skin);opacity:.4}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hover{fill:var(--skin);stroke:var(--text);stroke-width:2}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px}
.seg button{height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);min-width:42px}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.cal{background:var(--skin);color:var(--skin-ink);border-radius:var(--r-card);padding:16px}
.cal-grid{display:grid;grid-template-columns:22px repeat(12,1fr);gap:3px 2px;align-items:center}
.cal-grid .dl{font-size:11px;font-weight:600;opacity:.72}
.cal-grid svg{width:100%;height:22px;overflow:visible;display:block}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;font-weight:500}
.key span{display:inline-flex;align-items:center;gap:6px}
.key svg{width:16px;height:16px}
.feeders .fr{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:8px}
.feeders .fr svg{width:30px;height:30px}
.feeders .bar2{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.feeders .bar2 i{display:block;height:100%;background:var(--muted)}
.feeders .fr:first-child .bar2 i{background:var(--text)}
.feeders .n{font-variant-numeric:tabular-nums;font-weight:600}

.gk{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px;width:100%;border-radius:var(--r-row);background:var(--raised);transition:transform var(--t-fast) var(--ease)}
.gk:active{transform:scale(.985)}
.gk .av{width:56px;height:56px}
.gk .n{display:block;font-weight:700;font-size:18px}
.gk .s{display:block;font-size:13px;color:var(--muted)}
.gk svg.chev{width:18px;height:18px;color:var(--muted)}
details.guide{background:var(--surface);border-radius:var(--r-row)}
details.guide+details.guide{margin-top:6px}
details.guide summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;font-weight:600;cursor:pointer;border-radius:var(--r-row)}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary svg{width:18px;height:18px;color:var(--muted);transition:transform var(--t-mid) var(--ease)}
details.guide[open] summary svg{transform:rotate(90deg)}
details.guide .body{padding:0 16px 16px;font-size:15px}
details.guide ul{margin:0;padding-left:18px}
details.guide li{margin:6px 0}
.set{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;min-height:60px;padding:10px 16px}
.set+.set{box-shadow:inset 0 1px 0 var(--border)}
.set .t{font-weight:600;font-size:15px}
.set .s{font-size:13px;color:var(--muted);margin-top:2px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ground);box-shadow:inset 0 1px 0 var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;height:var(--navh);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;border-radius:14px}
.tab .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background-color var(--t-mid) linear,transform var(--t-fast) var(--ease)}
.tab svg{width:22px;height:22px}
.tab:hover{color:var(--text)}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"] .ic{background:var(--active)}
.tab-log{color:var(--text)}
.tab-log .ic{background:var(--primary);color:var(--on-primary);height:34px}
.tab:active .ic{transform:scale(.9)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;visibility:hidden;pointer-events:none;transition:opacity var(--t-sheet) var(--ease),visibility 0s linear var(--t-sheet)}
.scrim.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity var(--t-sheet) var(--ease),visibility 0s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--ground);border-radius:24px 24px 0 0;max-height:94dvh;
  display:flex;flex-direction:column;transform:translateY(102%);visibility:hidden;transition:transform var(--t-sheet) var(--ease),visibility 0s linear var(--t-sheet);
  box-shadow:0 -12px 40px rgba(0,0,0,.18);overscroll-behavior:contain}
.sheet.on{transform:none;visibility:visible;transition:transform var(--t-sheet) var(--ease),visibility 0s}
.grab{width:40px;height:5px;border-radius:9px;background:var(--control);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px 4px 20px}
.sheet-head h2{font-size:22px}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.x:hover{background:var(--active)}
.x svg{width:18px;height:18px}
.sheet-body{overflow-y:auto;overflow-x:hidden;padding:4px 20px 20px;overscroll-behavior:contain;touch-action:pan-y}
.sheet-foot{display:flex;gap:10px;padding:12px 20px calc(env(safe-area-inset-bottom) + 14px);box-shadow:inset 0 1px 0 var(--border)}
.sheet-foot .btn-primary{flex:1}

.field{margin-top:20px}
.field>.lab,.field>label{display:block;font-weight:600;font-size:14px;margin:0 0 8px}
.help{font-size:13px;color:var(--muted);margin-top:8px}
.inp{width:100%;height:48px;background:var(--raised);border:1px solid var(--control);border-radius:12px;padding:0 14px;font-size:16px;transition:border-color var(--t-fast) linear}
.inp:focus{border-color:var(--text);outline:none;box-shadow:0 0 0 1px var(--text)}
input.inp[type="date"],input.inp[type="datetime-local"],input.inp[type="time"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;
  font-size:16px;line-height:46px;text-align:left;color:var(--text)}
input.inp::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.4em}
input.inp::-webkit-datetime-edit{padding:0}
input.inp::-webkit-calendar-picker-indicator{opacity:.55}
.field{min-width:0}
textarea.inp{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.4}
.inp::placeholder,.big input::placeholder,.reading input::placeholder{color:var(--muted);opacity:1}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:var(--ctl);padding:0 16px;border-radius:999px;background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;
  transition:background-color var(--t-fast) linear,transform var(--t-fast) var(--ease)}
.opt:hover{background:var(--active)}
.opt:active{transform:scale(.96)}
.opt[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.opt .due{font-size:11px;font-weight:700;background:var(--skin);color:var(--skin-ink);padding:3px 7px;border-radius:999px}
.bugs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bug{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:16px;background:var(--surface);font-size:12px;font-weight:600;line-height:1.15;text-align:center;
  min-height:84px;transition:background-color var(--t-fast) linear,transform var(--t-fast) var(--ease)}
.bug svg{width:34px;height:34px}

.counts{margin-top:10px;display:flex;flex-direction:column;gap:6px}

.step{width:44px;height:44px;border-radius:12px;background:var(--raised);display:grid;place-items:center;transition:transform var(--t-fast) var(--ease)}
.step:active{transform:scale(.9)}
.step svg{width:18px;height:18px}
.big{display:flex;align-items:baseline;justify-content:center;gap:6px;background:var(--surface);border-radius:var(--r-card);padding:14px}

.tails{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border-radius:14px;background:var(--surface);font-size:12px;font-weight:600;min-height:84px;text-align:center;line-height:1.15}
.tail svg{width:40px;height:44px}
.tail[aria-pressed="true"]{background:var(--skin);color:var(--skin-ink)}
.readings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.reading{background:var(--surface);border-radius:16px;padding:10px 10px 12px;text-align:center}
.reading label{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.reading input{width:100%;border:0;background:none;outline:none;text-align:center;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.reading .ok{font-size:12px;font-weight:600;color:var(--muted)}
.reading.good{box-shadow:inset 0 0 0 2px var(--positive)} .reading.good .ok{color:var(--positive)}
.reading.off{box-shadow:inset 0 0 0 2px var(--warning)} .reading.off .ok{color:var(--warning)}
.reading:focus-within{box-shadow:inset 0 0 0 2px var(--text)}
.tip{padding:12px 14px;border-radius:14px;background:var(--surface);font-size:14px;margin-top:12px}
.tip.neg{background:var(--pill-neg-bg);color:var(--pill-neg-ink)}
.tip.warn{background:var(--pill-warn-bg);color:var(--pill-warn-ink)}
.photo{display:block;width:104px;height:104px;margin:4px auto 0;border-radius:50%;overflow:hidden;background:var(--skin)}
.photo img,.photo svg{width:100%;height:100%;object-fit:cover;display:block}
.add-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}

.add-grid button:hover{background:var(--active)}
.add-grid button:first-child{background:var(--skin);color:var(--skin-ink)}

.hello{min-height:100dvh;display:flex;flex-direction:column;background:var(--skin);color:var(--skin-ink);margin:0 calc(-1 * var(--side)) calc(-1 * (var(--navh) + 40px));padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 28px)}

.hello .link{color:var(--skin-ink);margin-top:8px;align-self:center}

.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 14px);z-index:60;transform:translate(-50%,16px);opacity:0;pointer-events:none;

  transition:opacity var(--t-mid) var(--ease),transform var(--t-mid) var(--ease),visibility 0s linear var(--t-mid);visibility:hidden;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0);pointer-events:auto}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}

<script>

  feed:   {name:'Meal',     plural:'Meals',     title:'Log a meal'},

  photo:  {name:'Photo',    plural:'Photos',    title:'Add a photo'},
};
// Skin colours per morph: the band, the meal spots and the drawn face all take them.
const SKINS = {
  classic:  {name:'Classic',     skin:'#F5C242', body:'#E9A92A', spot:'#231B14', ink:'#231B14'},
  tangerine:{name:'Tangerine',   skin:'#F49A3C', body:'#E5822A', spot:'#2A1A10', ink:'#231B14'},

  const m = (morph || '').toLowerCase();
  if (m.includes('black night')) return 'night';

  note:'<path d="M5 4.5h9.5L19 9v10.5H5z"/><path d="M14 4.5V9h5M8.5 13h7M8.5 16h4.5"/>',

const icon = (name, sw=1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

let S = load();
let view = 'today';
let journalFilter = 'all';
let growthRange = 90;
let mealSel = null;
let F = null;
let sheetRender = null;

function blank(){ return {v:1, updatedAt:0, geckos:[], logs:[], settings:{unit:'C', theme:'auto', active:null, hideInstall:false, lastBackup:null,
  sync:{code:null, on:false, last:null, error:null}, remind:{on:false, time:'19:00'}}}; }
function load(){
  try {

const API = (location.hostname === 'localhost' || location.protocol === 'file:') ? 'https://arifaqyl.me/gecko-api/' : new URL('../gecko-api/', location.href).href;
const syncOn = () => !!(S.settings.sync && S.settings.sync.on && S.settings.sync.code);

let syncT = null, syncing = false;

    if (!r.ok) throw new Error(r.status);

// On open: if the Pi has a newer log (say, edited on another device), take it.
async function pullData(){

    if (!r.ok) throw 0;
    const d = await r.json();

      const keep = {sync:S.settings.sync, remind:S.settings.remind, theme:S.settings.theme, hideInstall:S.settings.hideInstall};

/* ================= photos: stored on the phone (IndexedDB), copied to the Pi when sync is on ================= */
let dbP = null;
function db(){
  if (!dbP) dbP = new Promise((res, rej) => { const r = indexedDB.open('geckolog', 1); r.onupgradeneeded = () => { r.result.createObjectStore('photos'); r.result.createObjectStore('pending'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return dbP;
}
async function idb(store, mode, fn){ const d = await db(); return new Promise((res, rej) => { const tx = d.transaction(store, mode); const req = fn(tx.objectStore(store)); tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); }); }
const photoPut = (id, blob) => idb('photos', 'readwrite', s => s.put(blob, id));
const photoGet = id => idb('photos', 'readonly', s => s.get(id));
const photoDel = id => idb('photos', 'readwrite', s => s.delete(id));
const pendAdd = id => idb('pending', 'readwrite', s => s.put(1, id));
const pendDel = id => idb('pending', 'readwrite', s => s.delete(id));
const pendAll = () => idb('pending', 'readonly', s => s.getAllKeys());
async function uploadPending(){
  if (!syncOn()) return;
  for (const id of (await pendAll()) || []){
    const blob = await photoGet(id);
    if (!blob){ await pendDel(id); continue; }
    const r = await fetch(apiUrl('photo/' + id), {method:'PUT', headers:{'Content-Type':'image/jpeg'}, body: blob});
    if (r.ok) await pendDel(id); else break;
  }
}
const photoUrls = new Map();
async function photoUrl(id){
  if (photoUrls.has(id)) return photoUrls.get(id);
  let blob = await photoGet(id).catch(() => null);
  if (!blob && syncOn()){
    try { const r = await fetch(apiUrl('photo/' + id)); if (r.ok){ blob = await r.blob(); await photoPut(id, blob); } } catch(e){}
  }
  if (!blob) return null;
  const u = URL.createObjectURL(blob); photoUrls.set(id, u); return u;
}
// Fill every <img data-pid> on screen from the phone, or from the Pi on a new device.
function hydratePhotos(root=document){
  root.querySelectorAll('img[data-pid]:not([src])').forEach(async img => {
    const u = await photoUrl(img.dataset.pid);

}
function shrink(file, max=1440, q=.85){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('read')); };
    img.src = url;
  });
}

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

async function enableReminders(){
  if (!pushSupported()){
    toast(isIOS && !standalone() ? 'Add Gecko Log to your Home Screen first, then turn reminders on from there.' : 'This browser can’t show reminders.');
    return false;
  }
  if (!syncOn()){ S.settings.sync = Object.assign(S.settings.sync, {on:true, code:S.settings.sync.code || newCode()}); save(true); await pushData(); }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted'){ toast('Notifications are blocked. Allow them for this site in your phone’s settings.'); return false; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const {key} = await fetch(API + 'vapid').then(r => r.json());
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(key)});
    const r = await fetch(apiUrl('push'), {method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({subscription: sub.toJSON(), time: S.settings.remind.time, tz: Intl.DateTimeFormat().resolvedOptions().timeZone})});
    if (!r.ok) throw new Error(r.status);

  }
}

// Seeded random, so a day's spot keeps its shape forever.
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  let d = `M${mid(p[n-1],p[0]).map(v => v.toFixed(1)).join(',')}`;
  for (let i = 0; i < n; i++){ const m = mid(p[i], p[(i+1)%n]); d += ` Q${p[i][0].toFixed(1)},${p[i][1].toFixed(1)} ${m[0].toFixed(1)},${m[1].toFixed(1)}`; }

}

  if (kind === 'r') return `<path${cls} d="${blob(c,c,size*.36,seed)}" fill="none" stroke="var(--spot)" stroke-width="2"/>`;

/* ================= insights ================= */
const mealKind = f => f.d.ate === 'none' ? 'r' : f.d.ate === 'some' ? 'p' : 'f';
function mealsByDay(gid){
  const m = {}, rank = {r:1, p:2, f:3};
  logsOf(gid,'feed').forEach(f => {
    const k = sod(f.at), v = mealKind(f), cur = m[k];
    if (!cur || rank[v] > rank[cur.kind]) m[k] = {kind:v, log:f};

function insights(g){
  const st = STAGES[stageOf(g)];
  const feeds = logsOf(g.id, 'feed');
  const lastFeed = feeds[0];
  const every = feedEvery(g);
  const sinceFeed = lastFeed ? daysSince(lastFeed.at) : null;
  const feedDue = lastFeed ? every - sinceFeed : 0;
  const lastDust = id => feeds.find(f => f.d.dust === id);
  const d3 = lastDust('d3'), multi = lastDust('multi');
  const d3Due = d3 ? st.d3 - daysSince(d3.at) : 0;
  const multiDue = multi ? st.multi - daysSince(multi.at) : 0;
  const weights = logsOf(g.id, 'weight');
  const lastW = weights[0];
  const weighDue = lastW ? st.weigh - daysSince(lastW.at) : 0;
  const sheds = logsOf(g.id, 'shed');
  const done = sheds.filter(s => s.d.result !== 'pale');
  let avgShed = null;
  if (done.length >= 2){
    const gaps = []; for (let i = 0; i < Math.min(done.length-1, 6); i++) gaps.push((new Date(done[i].at) - new Date(done[i+1].at)) / DAY);
    avgShed = Math.round(gaps.reduce((a,b) => a+b, 0) / gaps.length);
  }
  const lastShed = done[0];
  const nextShed = lastShed && avgShed ? avgShed - daysSince(lastShed.at) : null;
  const tank = logsOf(g.id, 'tank')[0];
  const pale = sheds[0] && sheds[0].d.result === 'pale' && daysSince(sheds[0].at) <= 4;

  const alerts = [];
  if (sheds[0] && sheds[0].d.result === 'stuck' && daysSince(sheds[0].at) <= 7)
    alerts.push({lvl:'neg', t:`Stuck shed on ${(sheds[0].d.spots||[]).join(', ').toLowerCase() || 'the body'}`,
      s:'Give a warm, shallow soak for 15 to 20 minutes, then roll it off gently with a damp cotton bud. If toes stay wrapped, see a reptile vet.'});
  const recent = feeds.slice(0,3);
  if (recent.length === 3 && recent.every(f => f.d.ate === 'none'))
    alerts.push({lvl:'warn', t:'Refused the last 3 meals', s:'Check the warm side temperature and whether a shed is coming. Watch the tail and weight.'});
  if (weights.length >= 2 && lastW){
    const recentMax = Math.max(...weights.filter(w => daysSince(w.at) <= 45).map(w => w.d.g));
    if (lastW.d.g < recentMax * 0.9)
      alerts.push({lvl:'neg', t:`Down ${Math.round((1 - lastW.d.g/recentMax)*100)}% from ${g1(recentMax)} g`, s:'Losing more than a tenth of their weight is worth a reptile vet visit, especially if the tail is thinning.'});
  }
  const lastPoop = logsOf(g.id,'poop')[0];
  if (lastPoop && ['runny','odd'].includes(lastPoop.d.kind) && daysSince(lastPoop.at) <= 3)
    alerts.push({lvl:'warn', t:'Unusual poop logged '+ago(lastPoop.at), s:'If it happens again, check the warm side and ask a vet about a fecal test.'});

  const tasks = [];
  tasks.push({type:'feed', t:'Next meal', s: lastFeed ? `Last: ${feedSummary(lastFeed.d)}, ${ago(lastFeed.at)}` : 'No meals logged yet', due: feedDue});
  tasks.push({type:'feed', dust:'d3', t:'Calcium + D3', s: d3 ? `Last dusted ${ago(d3.at)}` : `Roughly every ${st.d3} days`, due: d3Due});
  tasks.push({type:'feed', dust:'multi', t:'Multivitamin', s: multi ? `Last dusted ${ago(multi.at)}` : `Roughly every ${st.multi} days`, due: multiDue});
  tasks.push({type:'weight', t:'Weigh-in', s: lastW ? `Last: ${g1(lastW.d.g)} g, ${ago(lastW.at)}` : `${st.name}s usually weigh ${st.range[0]} to ${st.range[1]} g`, due: weighDue});
  if (nextShed != null) tasks.push({type:'shed', t:'Next shed', s:`Usually every ${avgShed} days`, due: nextShed, estimate:true});
  tasks.push({type:'tank', t:'Tank check', s: tank ? `Warm side ${tank.d.warm != null ? g1(cToU(tank.d.warm)) + deg() : 'not taken'}, ${ago(tank.at)}` : 'Temperatures and humidity', due: tank ? 7 - daysSince(tank.at) : 0, soft:true});
  tasks.sort((a,b) => a.due - b.due);

  // The line under the name: the most useful thing to know right now.
  let finding;
  const dustTip = d3Due <= 0 ? ' Dust with calcium + D3.' : multiDue <= 0 ? ' Dust with multivitamin.' : '';
  const next = feedDue === 1 ? 'tomorrow' : 'in ' + feedDue + ' days';
  if (alerts.some(a => a.lvl === 'neg')) finding = alerts.find(a => a.lvl === 'neg').t + '.';
  else if (pale) finding = 'Going pale, so a shed is close. Keep the humid hide damp.';
  else if (!lastFeed) finding = 'Log the first meal to start the spot trail.';
  else if (sinceFeed === 0 && lastFeed.d.ate !== 'none') finding = `Ate ${feedSummary(lastFeed.d)} today.` + (feedDue >= 1 ? ` Next meal ${next}.` : '');
  else if (feedDue < 0) finding = `Last fed ${ago(lastFeed.at)}, so a meal is ${plural(-feedDue,'day')} late.` + dustTip;
  else if (feedDue === 0) finding = 'Dinner is due today.' + dustTip;
  else finding = `Fed ${ago(lastFeed.at)}. Next meal ${next}.`;

  return {st, lastFeed, sinceFeed, feedDue, every, lastW, weights, lastShed, avgShed, alerts, tasks, finding, d3Due, multiDue, tank, pale};
}

function logTitle(l){

    case 'feed': return d.ate === 'none' ? `Refused ${feedSummary(d)}` : d.ate === 'some' ? `Ate some of ${feedSummary(d)}` : `Ate ${feedSummary(d)}`;
    case 'weight': return `Weighed ${g1(d.g)} g`;
    case 'shed': return d.result === 'pale' ? 'Going pale before a shed' : d.result === 'stuck' ? `Stuck shed on ${(d.spots||[]).join(', ').toLowerCase() || 'some spots'}` : 'Shed cleanly';
    case 'poop': return 'Poop: ' + ((POOP.find(p => p.id === d.kind) || {}).name || '').toLowerCase();
    case 'tank': return 'Tank ' + [d.warm != null ? `warm ${g1(cToU(d.warm))}°` : null, d.cool != null ? `cool ${g1(cToU(d.cool))}°` : null, d.hum != null ? `${d.hum}% humidity` : null].filter(Boolean).join(', ');
    case 'note': return (d.tag && d.tag !== 'General' ? d.tag + ': ' : '') + ((l.note || '').split('\n')[0] || 'Note');
    case 'photo': return l.note ? l.note.split('\n')[0] : 'Photo';
  }
}
function logSub(l){
  const d = l.d || {}, bits = [];
  if (l.t === 'feed' && d.dust && d.dust !== 'none') bits.push('Dusted with ' + dustLower(d.dust));
  if (l.t === 'weight' && d.tail) bits.push('Tail looks ' + TAILS[d.tail-1].toLowerCase());
  if (l.t === 'shed' && d.helped) bits.push('Helped it along');
  if (l.t === 'photo'){ const g = gecko(l.g); if (g) bits.push(photoMeta(l, g)); }
  else if (l.t !== 'note' && l.note) bits.push(l.note);
  return bits.join('. ');
}

// "14 months old, 53.6 g": age at the photo's date and the weigh-in closest to it (within 3 weeks)
function ageAt(g, iso){
  if (!g.hatch) return null;
  const m = (new Date(iso) - new Date(g.hatch)) / (30.44*DAY);
  if (m < 0) return null;
  if (m < 1) return plural(Math.max(0, Math.round(m*30.44)), 'day') + ' old';
  if (m < 24) return plural(Math.floor(m), 'month') + ' old';
  return plural(Math.floor(m/12), 'year') + (Math.floor(m%12) ? ', ' + plural(Math.floor(m%12), 'month') : '') + ' old';
}
function weightNear(g, iso){
  const t = +new Date(iso); let best = null;
  logsOf(g.id, 'weight').forEach(w => { const dd = Math.abs(+new Date(w.at) - t); if (dd <= 21*DAY && (!best || dd < best.dd)) best = {dd, g:w.d.g}; });
  return best ? best.g : null;
}

  return [ageAt(g, l.at), w != null ? g1(w) + ' g' : null].filter(Boolean).join(', ');
}

function niceTicks(min, max, count=4){
  const span = max - min || 1;
  const raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(s => s*mag).find(s => s >= raw);
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
  const out = []; for (let v = lo; v <= hi + 1e-9; v += step) out.push(Math.round(v*100)/100);
  return out;
}
const CH = {W:343, H:200, L:34, R:8, T:12, B:24};
function weightChart(points){
  if (points.length < 2) return `<div class="empty"><b>${points.length ? 'One weigh-in so far' : 'No weigh-ins in this range'}</b>Weigh at least twice to draw the growth line. A kitchen scale that reads grams works well.</div>`;
  const {W,H,L,R,T,B} = CH;
  const xs = points.map(p => +new Date(p.at)), ys = points.map(p => p.d.g);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) x1 = x0 + DAY;
  const ticks = niceTicks(Math.min(...ys)*.97, Math.max(...ys)*1.03);
  const y0 = ticks[0], y1 = ticks[ticks.length-1];
  const X = x => L + (x-x0)/(x1-x0)*(W-L-R), Y = y => T + (1-(y-y0)/(y1-y0))*(H-T-B);
  const pts = points.map(p => [X(+new Date(p.at)), Y(p.d.g)]);
  window.__chart = {pts: points, coords: pts, L, R, W};
  const line = 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' L');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)},${H-B} L${pts[0][0].toFixed(1)},${H-B}Z`;
  const xl = [x0, x0 + (x1-x0)/2, x1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight went from ${g1(ys[0])} g to ${g1(ys[ys.length-1])} g">
    ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="tick" x="${L-6}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${t}</text>`).join('')}
    <line class="base" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
    ${xl.map((t,k) => `<text class="tick" x="${k === 0 ? L : k === 2 ? W-R : X(t).toFixed(1)}" y="${H-6}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${fmtShort.format(new Date(t))}</text>`).join('')}
    <path class="area" d="${area}"/><path class="line" d="${line}"/>
    <g id="whover" style="display:none"><line y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3"/><circle class="hover" r="5"/>
      <rect rx="8" height="36" width="98" fill="var(--primary)"/><text fill="var(--on-primary)" font-size="13" font-weight="600"></text><text fill="var(--on-primary)" font-size="11" opacity=".8"></text></g>
    <rect class="hit" x="${L}" y="0" width="${W-L-R}" height="${H-B}" data-chart="w"/>
  </svg>`;
}

function viewGrowth(){

  const photos = logsOf(g.id,'photo');

  return `${topBar()}

    <div class="sec-head"><h2 id="h-ph">Growing up</h2>${photos.length ? `<button class="link" type="button" data-act="timeline">${photos.length > 6 ? 'See all ' + photos.length : 'Timeline'}</button>` : ''}</div>

      ${photos.length < 6 && photos.length % 3 ? `<button class="ph add" type="button" data-act="log" data-type="photo">${icon('plus',2)}<span>Add</span></button>` : ''}</div>`

      : `<div class="empty"><b>No meals yet</b>Once you log a few, the insects ${esc(g.name)} eats most show up here.</div>`}

}

function viewGeckos(){
  const guide = [
    ['Feeding', `<ul><li><b>Hatchlings and juveniles:</b> most days, as many insects as they’ll eat in about 10 to 15 minutes.</li><li><b>Sub-adults:</b> every 1 to 2 days.</li><li><b>Adults (12 to 18 months and up):</b> every 2 to 4 days. Adults are easy to overfeed, so watch the tail.</li><li>An insect should be no longer than the space between the eyes. Gut-load feeders for a day before.</li><li>Superworms and waxworms are treats, not staples.</li></ul>`],
    ['Supplements', `<ul><li><b>Plain calcium</b> (no D3) on most meals.</li><li><b>Calcium with D3</b> about weekly for young geckos and every 1 to 2 weeks for adults. Less if you run a UVB light, since UVB lets them make their own D3.</li><li><b>Multivitamin</b> about weekly for juveniles and every couple of weeks for adults.</li></ul>`],
    ['Temperatures', `<ul><li><b>Warm hide floor:</b> about 30 to 35°C (88 to 95°F).</li><li><b>Cool side:</b> about 22 to 27°C (72 to 80°F).</li><li><b>Night:</b> can fall to around 18 to 22°C.</li><li>Run the heater on a thermostat, and check the floor under the warm hide with a probe or temperature gun.</li></ul>`],
    ['Humidity and shedding', `<ul><li>Keep the tank fairly dry, around 30 to 50%.</li><li>Add a <b>humid hide</b> with damp moss or paper towel for sheds.</li><li>Going pale or grey means a shed is a day or two away. Most geckos eat their shed.</li><li>Afterwards, check the <b>toes, tail tip and eyes</b>. Stuck shed on toes can cut off blood flow.</li></ul>`],
    ['Signs of a healthy gecko', `<ul><li>A plump tail, about as thick as the neck. A very fat tail can mean overfeeding.</li><li>Clear, bright eyes and complete sheds.</li><li>Hunts eagerly and uses both the warm and cool sides.</li><li>Firm brown poop with a white urate.</li><li>Never grab the tail. They can drop it, and it grows back different.</li></ul>`],
    ['When to see a vet', `<ul><li>Steady weight loss of more than about 10%, or a thinning tail.</li><li>Not eating for a long stretch along with weight loss, rather than a shed or a cool-season slowdown.</li><li>Runny or bloody poop that keeps happening, or repeated regurgitation.</li><li>Stuck shed that won’t come off after a soak, swollen toes, or cloudy, sunken eyes.</li><li>Shaky legs, a soft jaw or trouble walking. These can be signs of metabolic bone disease.</li></ul>`],

  <div class="panel"><div class="rows">${S.geckos.map(g => { const st = STAGES[stageOf(g)]; const w = logsOf(g.id,'weight')[0];
    return `<button class="gk" type="button" data-act="geckoForm" data-id="${g.id}">${avatar(g)}<span style="min-width:0"><span class="n">${esc(g.name)}</span>
      <span class="s">${esc([g.morph, g.sex === 'female' ? 'Female' : g.sex === 'male' ? 'Male' : null, ageText(g) || st.name].filter(Boolean).join(', '))}</span>
      <span class="s">${w ? g1(w.d.g) + ' g. ' : ''}Fed ${feedEvery(g) === 1 ? 'daily' : 'every ' + feedEvery(g) + ' days'}</span></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">${ICON.chev}</svg></button>`; }).join('')}</div></div>

  <section class="sec" aria-labelledby="h-care">
    <div class="sec-head"><h2 id="h-care">Care guide</h2></div>
    ${guide.map(([t,c]) => `<details class="guide"><summary>${t}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">${ICON.chev}</svg></summary><div class="body">${c}</div></details>`).join('')}
    <p class="help" style="margin:10px 4px 0">General guidance from common care sheets, which don’t always agree. A reptile vet knows your gecko best.</p>

  <section class="sec" aria-labelledby="h-pi">
    <div class="sec-head"><h2 id="h-pi">Backup and reminders</h2></div>
    <div class="panel" style="padding:0">
      <div class="set"><div><div class="t" id="lab-sync">Back up to your Pi</div><div class="s" id="syncState">${esc(syncText())}</div></div>
        <button class="switch" type="button" role="switch" aria-checked="${syncOn()}" aria-labelledby="lab-sync" data-act="syncToggle"></button></div>
      ${syncOn() ? `<div class="set"><div><div class="t">Open on another device</div><div class="s">The link carries your log’s secret code. Only share it with yourself.</div></div><button class="btn btn-quiet" type="button" data-act="copyLink">Copy link</button></div>` : ''}
      <div class="set"><div><div class="t" id="lab-rem">Daily reminder</div><div class="s">${S.settings.remind.on ? `At ${esc(S.settings.remind.time)}, only on days something is due` : 'Meals, D3 and weigh-ins, sent by your Pi'}</div></div>
        <button class="switch" type="button" role="switch" aria-checked="${!!S.settings.remind.on}" aria-labelledby="lab-rem" data-act="remindToggle"></button></div>
      ${S.settings.remind.on ? `<div class="set"><label class="t" for="f-rtime">Reminder time</label><div style="display:flex;gap:8px;align-items:center"><input class="inp" id="f-rtime" type="time" value="${esc(S.settings.remind.time)}" style="width:120px;height:40px" data-remind-time="1"><button class="btn btn-quiet" type="button" data-act="testPush">Test</button></div></div>` : ''}

      <div class="set"><div class="t">Appearance</div><div class="seg" role="group" aria-label="Appearance">${[['auto','Auto'],['light','Light'],['dark','Dark']].map(([k,n]) => `<button type="button" data-act="theme" data-k="${k}" aria-pressed="${S.settings.theme === k}">${n}</button>`).join('')}</div></div>
      <div class="set"><div><div class="t">Export a backup file</div><div class="s">${S.settings.lastBackup ? 'Last saved ' + ago(S.settings.lastBackup) : 'A copy you keep yourself (photos not included)'}</div></div><button class="btn btn-quiet" type="button" data-act="export">Export</button></div>
      <div class="set"><div><div class="t">Restore a backup</div><div class="s">Replaces what’s on this phone</div></div><button class="btn btn-quiet" type="button" data-act="import">Import</button></div>
    </div>
  </section>
  <section class="sec" aria-labelledby="h-erase">
    <div class="sec-head"><h2 id="h-erase">Erase</h2></div>
    <div class="panel" style="padding:0"><div class="set"><div><div class="t">Erase everything</div><div class="s">Deletes every gecko and entry on this phone</div></div><button class="btn btn-danger" type="button" data-act="wipe">Erase</button></div></div>
  </section>`;
}

/* ================= sheet ================= */
function openSheet(title, renderFn){
  sheetRender = renderFn;
  $('#sheetTitle').textContent = title;
  drawSheet();
  $('#sheetBody').scrollTop = 0;
  if (!sheetOpen){
    lastFocus = document.activeElement;
    $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
    $('#view').setAttribute('inert',''); $('#nav').setAttribute('inert','');
    sheetOpen = true;
    history.pushState({sheet:true}, '', location.hash || '#' + view);
    setTimeout(() => $('#sheet .x').focus({preventScroll:true}), 60);
  }
}
function drawSheet(){
  const {body, foot} = sheetRender();
  $('#sheetBody').innerHTML = body;
  $('#sheetFoot').innerHTML = foot;
  hydratePhotos($('#sheetBody'));
}
function closeSheet(fromPop=false){
  if (!sheetOpen) return;
  $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on');
  $('#view').removeAttribute('inert'); $('#nav').removeAttribute('inert');
  sheetOpen = false; F = null; confirmCb = null;
  if (!fromPop && history.state && history.state.sheet){ skipPop = true; history.back(); }
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}

function geckoPicker(){
  if (S.geckos.length < 2) return '';
  return `<div class="field" style="margin-top:4px"><span class="lab" id="lab-g">Gecko</span><div class="opts" role="group" aria-labelledby="lab-g">${S.geckos.map(g =>
    `<button class="opt" type="button" data-act="fset" data-k="g" data-v="${g.id}" aria-pressed="${F.g === g.id}" style="padding-left:6px"><span class="av" style="width:32px;height:32px">${g.photo ? `<img src="${g.photo}" alt="" width="32" height="32">` : geckoFace(skinOf(g))}</span>${esc(g.name)}</button>`).join('')}</div></div>`;
}
const whenField = () => `<div class="field"><label for="f-at">When</label><input class="inp" id="f-at" name="when" type="datetime-local" value="${F.at}" data-in="at"></div>`;
const noteField = (ph='Anything worth remembering…') => `<div class="field"><label for="f-note">Notes <span class="muted" style="font-weight:400">(optional)</span></label><textarea class="inp" id="f-note" name="note" data-in="note" placeholder="${ph}" autocomplete="off">${esc(F.note)}</textarea></div>`;
const optGroup = (key, label, opts, extra) => `<div class="field"><span class="lab" id="lab-${key}">${label}</span><div class="opts" role="group" aria-labelledby="lab-${key}">${opts.map(o =>
  `<button class="opt" type="button" data-act="fset" data-k="${key}" data-v="${o.id}"${typeof o.id === 'number' ? ' data-num="1"' : ''} aria-pressed="${String(F[key]) === String(o.id)}">${o.name}${extra ? extra(o) : ''}</button>`).join('')}</div></div>`;
const footer = (isEdit, label) => `${isEdit ? `<button class="btn btn-danger" type="button" data-act="delLog">Delete</button>` : ''}<button class="btn btn-primary" type="button" data-act="saveLog">${label}</button>`;

function openLog(type, existing, preset={}){
  const g = active();
  if (existing){
    F = Object.assign({}, JSON.parse(JSON.stringify(existing.d)), {id:existing.id, g:existing.g, at:toLocalInput(existing.at), note:existing.note || '', t:type});
    if (type === 'weight') F.gv = existing.d.g;
  } else {
    F = Object.assign({t:type, g:g.id, at:toLocalInput(Date.now()), note:''}, defaults(type, g), preset);
  }
  const labels = {feed:'Save meal', weight:'Save weight', shed:'Save shed', poop:'Save poop check', tank:'Save readings', note:'Save note', photo:'Save photo'};
  openSheet(existing ? 'Edit ' + TYPES[type].name.toLowerCase() : TYPES[type].title, () => ({body: geckoPicker() + FORMS[type](), foot: footer(!!existing, existing ? 'Save changes' : labels[type])}));
}
function defaults(type, g){
  const last = logsOf(g.id, type)[0];
  switch (type){
    case 'feed': return {items: last ? last.d.items.map(i => ({bug:i.bug, n:i.n})) : [{bug:'crickets', n:5}], dust: suggestDust(g), ate:'all'};
    case 'weight': return {gv:'', tail:3};
    case 'shed': return {result:'clean', spots:[], helped:false};
    case 'poop': return {kind:'normal'};
    case 'tank': return {warm:'', cool:'', hum:''};
    case 'note': return {tag:'General'};
    case 'photo': return {pid:null, blob:null};
  }
}

const FORMS = {
  photo(){
    const g = gecko(F.g);
    const shown = F.blob ? (F.preview || '') : '';
    return `
    <div class="field" style="margin-top:8px"><span class="lab sr">Photo</span>
      <button class="shot" type="button" data-act="pickShot" aria-label="${F.blob || F.pid ? 'Change photo' : 'Choose a photo'}">
        ${F.blob ? `<img src="${shown}" alt="">` : F.pid ? `<img data-pid="${F.pid}" alt="">` : `${icon('photo',1.6)}<span>Take or choose a photo</span>`}</button>
      ${F.blob || F.pid ? `<p class="help" style="text-align:center">${esc([ageAt(g, F.at || new Date().toISOString()), weightNear(g, F.at ? new Date(F.at).toISOString() : new Date().toISOString()) != null ? g1(weightNear(g, new Date(F.at || Date.now()).toISOString())) + ' g' : null].filter(Boolean).join(', ') || 'Saved with the date, age and weight.')}</p>` : ''}</div>
    <div class="field"><label for="f-note">Caption <span class="muted" style="font-weight:400">(optional)</span></label><input class="inp" id="f-note" name="caption" data-in="note" value="${esc(F.note)}" placeholder="First week home…" maxlength="80" autocomplete="off"></div>
    ${whenField()}`;
  },
  feed(){
    const g = gecko(F.g), sug = suggestDust(g), sel = F.items.map(i => i.bug);
    return `
    <div class="field" style="margin-top:8px"><span class="lab" id="lab-bugs">What did you offer?</span>
      <div class="bugs" role="group" aria-labelledby="lab-bugs">${BUGS.map(b => `<button class="bug" type="button" data-act="bug" data-b="${b.id}" aria-pressed="${sel.includes(b.id)}">${bugSvg(b.id)}${b.short || b.name}</button>`).join('')}</div>
      ${F.items.length ? `<div class="counts">${F.items.map(it => { const b = BUGS.find(x => x.id === it.bug);
        return `<div class="count">${bugSvg(b.id)}<span class="nm">${b.name}${b.treat ? ' <span class="pill warn" style="margin-left:4px">Treat</span>' : ''}</span>
          <button class="step" type="button" data-act="cnt" data-b="${b.id}" data-d="-1" aria-label="One fewer ${b.name.toLowerCase()}">${icon('minus',2.2)}</button>
          <span class="n" aria-live="polite">${it.n}</span>
          <button class="step" type="button" data-act="cnt" data-b="${b.id}" data-d="1" aria-label="One more ${b.name.toLowerCase()}">${icon('plus',2.2)}</button></div>`; }).join('')}</div>` : ''}
    </div>
    ${optGroup('dust', 'Dusted with', DUST, o => o.id === sug && sug !== 'cal' ? ' <span class="due">Due</span>' : '')}
    ${sug !== 'cal' ? `<p class="help">${sug === 'd3' ? 'Calcium + D3' : 'Multivitamin'} is due for ${esc(g.name)}, so it’s picked for you.</p>` : ''}
    ${optGroup('ate', 'How did it go?', ATE)}
    ${F.ate === 'none' ? `<div class="tip warn">Skipped meals are common before a shed, in cooler months and in full adults. Check the warm side, and keep an eye on the tail and weight.</div>` : ''}
    ${whenField()}${noteField()}`;
  },
  weight(){
    const g = gecko(F.g), st = STAGES[stageOf(g)];
    const last = logsOf(F.g, 'weight').find(w => w.id !== F.id);
    return `
    <div class="field" style="margin-top:8px"><label for="f-w" class="sr">Weight in grams</label>
      <div class="big"><input id="f-w" name="weight" type="number" inputmode="decimal" step="0.1" min="0" max="500" placeholder="0" value="${esc(F.gv ?? '')}" data-in="gv" autocomplete="off" aria-describedby="w-help"><span aria-hidden="true">g</span></div>
      <p class="help" id="w-help" style="text-align:center">${weightHelp(last, st)}</p></div>
    <div class="field"><span class="lab" id="lab-tail">Tail</span>
      <div class="tails" role="group" aria-labelledby="lab-tail">${TAILS.map((n,k) => `<button class="tail" type="button" data-act="fset" data-k="tail" data-v="${k+1}" data-num="1" aria-pressed="${F.tail === k+1}">${tailArt(k)}${n}</button>`).join('')}</div>
      <p class="help">A healthy tail is about as thick as the neck.</p></div>
    ${whenField()}${noteField('Before or after a meal…')}`;
  },
  shed(){
    return `
    ${optGroup('result', 'How is it going?', SHED)}
    ${F.result === 'stuck' ? `
      <div class="field"><span class="lab" id="lab-sp">Where is it stuck?</span><div class="opts" role="group" aria-labelledby="lab-sp">${SHED_SPOTS.map(s => `<button class="opt" type="button" data-act="spot" data-s="${s}" aria-pressed="${F.spots.includes(s)}">${s}</button>`).join('')}</div></div>
      <div class="field"><button class="opt" type="button" data-act="fset" data-k="helped" data-v="${!F.helped}" data-bool="1" aria-pressed="${F.helped}">I helped with a soak or cotton bud</button></div>
      <div class="tip neg">Stuck shed on toes can cut off blood flow. Give a warm, shallow soak for 15 to 20 minutes (or a damp paper-towel “sauna”), then roll it off gently with a damp cotton bud. Don’t pull. Keep the humid hide damp, and see a vet if it won’t come off.</div>` : ''}
    ${F.result === 'pale' ? `<div class="tip">Going pale or grey means a shed is a day or two away. Dampen the humid hide. Skipping a meal now is normal.</div>` : ''}
    ${F.result === 'clean' ? `<div class="tip">Check the toes, tail tip and eyes for any bits left behind.</div>` : ''}
    ${whenField()}${noteField()}`;
  },
  poop(){
    return `
    <div class="field" style="margin-top:8px"><span class="lab" id="lab-pp">What did it look like?</span>
      <div class="rows" role="group" aria-labelledby="lab-pp">${POOP.map(p => { const on = F.kind === p.id;

    ${['runny','undigested','odd'].includes(F.kind) ? `<div class="tip warn">${F.kind === 'undigested' ? 'Undigested insects often mean the warm side is too cool for proper digestion. Check the floor temperature under the warm hide.' : 'One odd poop is usually nothing. If it keeps happening, check temperatures and ask a reptile vet about a fecal test for parasites.'}</div>` : ''}
    ${whenField()}${noteField()}`;

  tank(){
    return `
    <div class="field" style="margin-top:8px"><span class="lab">Readings</span>
      <div class="readings">${reading('warm','Warm side',true)}${reading('cool','Cool side',true)}${reading('hum','Humidity',false)}</div>
      <p class="help">Warm side means the floor under the warm hide. Humidity is the main tank, not the humid hide.</p></div>
    ${whenField()}${noteField('New bulb, deep clean, moved décor…')}`;
  },
  note(){
    return `
    ${optGroup('tag', 'Kind of note', NOTE_TAGS.map(t => ({id:t, name:t})))}
    <div class="field"><label for="f-note">Note</label><textarea class="inp" id="f-note" name="note" data-in="note" style="min-height:140px" placeholder="What happened…" autocomplete="off">${esc(F.note)}</textarea></div>
    ${whenField()}`;
  },
};
function weightHelp(last, st){
  const v = parseFloat(F.gv);
  if (!last) return `${st.name}s usually weigh ${st.range[0]} to ${st.range[1]} g.`;
  let s = `Last time ${g1(last.d.g)} g, ${ago(last.at)}.`;
  if (!isNaN(v) && v > 0){ const d = Math.round((v - last.d.g)*10)/10; s += d === 0 ? ' No change.' : ` That’s <b>${d > 0 ? '+' : '−'}${g1(Math.abs(d))} g</b>.`; }
  return s;
}
function readingState(key){
  const rng = TANK[key], conv = key !== 'hum';
  const n = parseFloat(F[key]);
  if (isNaN(n)) return {cls:'', msg:'Aim for ' + (conv ? `${cToU(rng[0])}–${cToU(rng[1])}°` : `${rng[0]}–${rng[1]}%`)};
  const c = conv ? uToC(n) : n;
  if (c < rng[0]) return {cls:'off', msg:'A bit low'};
  if (c > rng[1]) return {cls:'off', msg:'A bit high'};
  return {cls:'good', msg:'Looks right'};
}
function reading(key, label, conv){
  const s = readingState(key);
  return `<div class="reading ${s.cls}" data-box="${key}"><label for="f-${key}">${label}${conv ? '' : ''}</label>
    <input id="f-${key}" name="${key}" type="number" inputmode="decimal" step="0.1" placeholder="–" value="${esc(F[key])}" data-in="${key}" autocomplete="off" aria-describedby="ok-${key}">

}

async function savePhoto(){
  if (!F.blob && !F.pid){ toast('Choose a photo first.'); return; }
  const btn = $('#sheetFoot .btn-primary'); if (btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  const pid = F.pid || ('p' + uid());
  try {
    if (F.blob){ await photoPut(pid, F.blob); await pendAdd(pid); photoUrls.delete(pid); }
  } catch(e){ toast('Couldn’t store the photo. Phone storage may be full.'); if (btn){ btn.disabled = false; btn.textContent = 'Save photo'; } return; }
  const at = F.at && !isNaN(new Date(F.at)) ? new Date(F.at).toISOString() : new Date().toISOString();
  const entry = {id: F.id || uid(), g: F.g, t:'photo', at, d:{pid}, note:(F.note || '').trim()};
  const idx = S.logs.findIndex(l => l.id === entry.id);
  if (idx >= 0) S.logs[idx] = entry; else S.logs.push(entry);
  if (F.preview) URL.revokeObjectURL(F.preview);
  if (!save()) return;
  const g = gecko(entry.g);
  closeSheet();
  if (idx < 0 && view !== 'growth') afterClose(() => showView('growth')); else render();
  toast(idx >= 0 ? 'Changes saved' : `Added to ${g.name}’s timeline`);
}
function saveLog(){
  const t = F.t, d = {};
  if (t === 'photo') return savePhoto();
  if (t === 'feed'){
    d.items = F.items.filter(i => i.n > 0);
    if (!d.items.length) return toast('Pick at least one insect.');
    d.dust = F.dust; d.ate = F.ate;
  }
  if (t === 'weight'){
    const v = parseFloat(F.gv);
    if (!(v > 0) || v > 500){ toast('Enter a weight in grams, like 54.2.'); $('#f-w') && $('#f-w').focus(); return; }
    d.g = Math.round(v*10)/10; d.tail = F.tail;
  }
  if (t === 'shed'){ d.result = F.result; if (F.result === 'stuck'){ d.spots = F.spots; d.helped = F.helped; } }
  if (t === 'poop') d.kind = F.kind;
  if (t === 'tank'){
    const num = k => { const n = parseFloat(F[k]); return isNaN(n) ? null : n; };
    d.warm = num('warm') != null ? uToC(num('warm')) : null;
    d.cool = num('cool') != null ? uToC(num('cool')) : null;
    d.hum = num('hum');
    if (d.warm == null && d.cool == null && d.hum == null){ toast('Enter at least one reading.'); $('#f-warm') && $('#f-warm').focus(); return; }
  }
  if (t === 'note'){ d.tag = F.tag; if (!F.note.trim()){ toast('Write the note first.'); $('#f-note') && $('#f-note').focus(); return; } }
  const at = F.at && !isNaN(new Date(F.at)) ? new Date(F.at).toISOString() : new Date().toISOString();
  const entry = {id: F.id || uid(), g: F.g, t, at, d, note: (F.note || '').trim()};
  const idx = S.logs.findIndex(l => l.id === entry.id);
  if (idx >= 0) S.logs[idx] = entry; else S.logs.push(entry);
  if (!save()) return;
  const g = gecko(entry.g);
  if (t === 'feed' && idx < 0){ newSpotDay = sod(at); mealSel = sod(at); S.settings.active = g.id; save(); }
  const msg = idx >= 0 ? 'Changes saved' : {
    feed: d.ate === 'none' ? `Refusal logged for ${g.name}` : `Meal logged for ${g.name}`,
    weight: `${g.name} weighs ${g1(d.g)} g`,
    shed: d.result === 'pale' ? 'Shed on its way' : d.result === 'stuck' ? 'Stuck shed logged' : 'Shed logged',
    poop: 'Poop check saved', tank: 'Tank readings saved', note: 'Note saved'}[t];
  const goToday = t === 'feed' && idx < 0 && view !== 'today';
  closeSheet();
  if (goToday){ newSpotDay = sod(at); afterClose(() => { showView('today'); }); } else render();
  toast(msg);
}

let undoBuf = null;
function deleteLog(id){
  id = typeof id === 'string' ? id : F.id;

  S.logs = S.logs.filter(x => x.id !== id);

/* ================= toast ================= */
let toastT;
function toast(msg, actionLabel, action){
  const t = $('#toast');
  t.innerHTML = `<span class="msg">${esc(msg)}</span>${actionLabel ? `<button type="button" id="toastAct">${esc(actionLabel)}</button>` : ''}`;
  if (actionLabel) $('#toastAct').onclick = () => { t.classList.remove('on'); action(); };
  t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), actionLabel ? 6000 : 2600);
}

function exportData(){
  S.settings.lastBackup = new Date().toISOString(); save();
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `gecko-log-backup-${toLocalInput(Date.now()).slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  render(); toast('Backup saved to your downloads');
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); if (!d || d.v !== 1 || !Array.isArray(d.geckos) || !Array.isArray(d.logs)) throw 0; }
    catch(e){ toast('That file isn’t a Gecko Log backup.'); return; }
    const apply = () => { const keep = {sync:S.settings.sync, remind:S.settings.remind}; S = Object.assign(blank(), d, {settings:Object.assign(blank().settings, d.settings, keep)}); save(); closeSheet(); afterClose(() => showView('today')); toast(`Restored ${plural(d.geckos.length,'gecko')} and ${plural(d.logs.length,'entry','entries')}`); };
    if (!S.geckos.length) apply();
    else confirmSheet('Replace this phone’s log?', `The backup has ${plural(d.geckos.length,'gecko')} and ${plural(d.logs.length,'entry','entries')}. It replaces everything here.`, 'Replace', apply);
  };
  r.readAsText(file);
}
async function askPersist(){ try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e){} }

function applyTheme(){
  const t = S.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const c = !S.geckos.length ? (dark ? '#f2bd3b' : '#f5c242') : dark ? '#121110' : '#ffffff';
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute('content', c));

/* ================= routing ================= */
function go(v){ if (v === view) { scrollTo({top:0, behavior:'smooth'}); return; } view = v; history.pushState(null, '', '#' + v); render(); scrollTo(0,0); $('#view').focus({preventScroll:true}); }
function fromHash(){ const h = location.hash.slice(1); view = VIEWS.includes(h) ? h : 'today'; }
// Closing a sheet pops its history entry asynchronously; anything that changes the page waits for that pop.
let skipPop = false, afterPop = null;
function afterClose(fn){ if (skipPop) afterPop = fn; else fn(); }
function showView(v){ view = v; history.replaceState(null, '', '#' + v); render(); scrollTo(0,0); }
addEventListener('popstate', () => {
  if (skipPop){ skipPop = false; const f = afterPop; afterPop = null; if (f) f(); return; }
  if (sheetOpen){ closeSheet(true); return; }
  const prev = view; fromHash(); if (prev !== view) render();
});

    const link = location.origin + location.pathname + '#k=' + S.settings.sync.code;
    try { await navigator.clipboard.writeText(link); toast('Link copied. Open it on your other device.'); }
    catch(e){ prompt('Copy this link:', link); }
  },
  remindToggle: async el => {
    if (S.settings.remind.on){ await disableReminders(); render(); toast('Reminders off'); return; }
    el.setAttribute('aria-busy','true');
    const ok = await enableReminders();
    render();
    if (ok) toast(`Reminders on for ${S.settings.remind.time}`);
  },
  testPush: async () => {
    try { const r = await fetch(apiUrl('push/test'), {method:'POST'}); toast(r.ok ? 'Test sent. It should pop up in a few seconds.' : 'The Pi couldn’t send it. Try turning reminders off and on.'); }
    catch(e){ toast('Couldn’t reach the Pi.'); }
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]){ e.preventDefault(); ACT[el.dataset.act](el, e); return; }
  const a = e.target.closest('a[href^="#"]');
  if (a && !a.classList.contains('skip')){ const v = a.getAttribute('href').slice(1); if (VIEWS.includes(v)){ e.preventDefault(); go(v); } }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in;
  if (!k || !F) return;
  F[k] = e.target.value;
  if (e.target.dataset.redraw){ const id = e.target.id; drawSheet(); const el = document.getElementById(id); if (el) el.focus({preventScroll:true}); return; }
  if (F.t === 'weight' && k === 'gv'){ const g = gecko(F.g); $('#w-help').innerHTML = weightHelp(logsOf(F.g,'weight').find(w => w.id !== F.id), STAGES[stageOf(g)]); }
  if (F.t === 'tank' && TANK[k]){ const s = readingState(k); document.querySelector(`[data-box="${k}"]`).className = 'reading ' + s.cls; $('#ok-' + k).textContent = s.msg; }
  if (F.kind === 'gecko' && k === 'name'){ const b = $('#sheetFoot .btn-primary'); if (b && !F.id) b.textContent = 'Add ' + (F.name.trim() || 'gecko'); }
});
$('#filePhoto').addEventListener('change', e => { const f = e.target.files[0]; if (f) pickPhoto(f); e.target.value = ''; });
$('#fileShot').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !F) return;
  try { const b = await shrink(f); if (F.preview) URL.revokeObjectURL(F.preview); F.blob = b; F.preview = URL.createObjectURL(b); drawSheet(); }
  catch(err){ toast('That photo couldn’t be read. Try a JPEG or PNG.'); }
});
document.addEventListener('change', async e => {
  if (!e.target.dataset || !e.target.dataset.remindTime || !e.target.value) return;
  S.settings.remind.time = e.target.value; save(true);
  if (S.settings.remind.on){ const ok = await enableReminders(); if (ok) toast(`Reminder moved to ${e.target.value}`); render(); }
});
$('#fileImport').addEventListener('change', e => { const f = e.target.files[0]; if (f) importData(f); e.target.value = ''; });
document.addEventListener('keydown', e => {
  if (!sheetOpen) return;
  if (e.key === 'Escape'){ ACT.close(); return; }
  if (e.key === 'Tab'){
    const f = [...$('#sheet').querySelectorAll('button,input,textarea,select')].filter(x => !x.disabled && x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
  if (e.key === 'Enter' && e.target.matches('input')){ e.preventDefault(); const b = $('#sheetFoot .btn-primary'); b && b.click(); }
});

// Weight chart: show the nearest weigh-in under the finger or cursor.
function chartHover(e){
  const hit = e.target.closest && e.target.closest('[data-chart="w"]');
  const hov = document.getElementById('whover');
  if (!hov) return;
  if (!hit || !window.__chart){ hov.style.display = 'none'; return; }
  const svg = hit.ownerSVGElement, pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const x = pt.matrixTransform(svg.getScreenCTM().inverse()).x;
  const {pts, coords, L, R, W} = window.__chart;
  let k = 0; coords.forEach((c,j) => { if (Math.abs(c[0] - x) < Math.abs(coords[k][0] - x)) k = j; });
  const [cx, cy] = coords[k];
  hov.style.display = '';
  const ln = hov.querySelector('line'); ln.setAttribute('x1', cx); ln.setAttribute('x2', cx);
  const c = hov.querySelector('circle'); c.setAttribute('cx', cx); c.setAttribute('cy', cy);
  const bx = Math.min(Math.max(cx - 49, L), W - R - 98), by = Math.max(cy - 48, 0);
  const rc = hov.querySelector('rect'); rc.setAttribute('x', bx); rc.setAttribute('y', by);
  const [t1, t2] = hov.querySelectorAll('text');
  t1.setAttribute('x', bx + 10); t1.setAttribute('y', by + 16); t1.textContent = g1(pts[k].d.g) + ' g';
  t2.setAttribute('x', bx + 10); t2.setAttribute('y', by + 29); t2.textContent = dayLabel(pts[k].at);
}
document.addEventListener('pointermove', chartHover);
document.addEventListener('pointerdown', chartHover);

// Drag the sheet's handle down to close (the close button does the same).
(() => {
  const sh = $('#sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (!e.target.closest('.grab,.sheet-head')) return; y0 = e.touches[0].clientY; dy = 0; }, {passive:true});
  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
  sh.addEventListener('touchend', () => { if (y0 == null) return; sh.style.transition = ''; sh.style.transform = ''; if (dy > 100) ACT.close(); y0 = null; });
})();

addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (view === 'today' && !sheetOpen && S.geckos.length) render(); });
addEventListener('storage', e => { if (e.key === KEY){ S = load(); if (!sheetOpen) render(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js?v=8').catch(() => {});
let lastDay = sod(Date.now());
document.addEventListener('visibilitychange', async () => {
  if (document.hidden){ if (syncT){ clearTimeout(syncT); pushData(); } return; }
  const changed = await pullData();
  if ((changed || sod(Date.now()) !== lastDay) && !sheetOpen){ lastDay = sod(Date.now()); render(); }
});

// Feel like an app: iOS Safari ignores user-scalable=no, so stop its pinch gestures here.
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});

// Boot. #k=<code> links this device to a log on the Pi; ?log=feed comes from the home-screen shortcut.
const linkCode = (location.hash.match(/^#k=([a-f0-9]{32,64})$/) || [])[1];
if (linkCode){
  S.settings.sync = Object.assign(S.settings.sync || {}, {on:true, code:linkCode, error:null});
  S.updatedAt = 0;   // let the Pi's copy win on this device
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  history.replaceState(null, '', location.pathname + '#today');
}
fromHash();
render();
pullData().then(changed => { if (changed && !sheetOpen){ render(); if (linkCode) toast('Your log is on this device now'); } else if (linkCode && !S.geckos.length) toast('Couldn’t load that log. Check the link.'); });
const q = new URLSearchParams(location.search).get('log');
if (q && TYPES[q] && S.geckos.length){ history.replaceState(null, '', location.pathname + '#' + view); openLog(q); }
</script>
</body>
