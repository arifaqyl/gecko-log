# Gecko Log behind nginx (excerpt for an existing `server { … }` block).
# The app is static; the optional sync + reminder service runs on 127.0.0.1:8096.

location /gecko/ {
    alias /var/www/gecko/;            # copy of app/
    index index.html;
    try_files $uri $uri/ /gecko/index.html;

    # the service worker and HTML must not be cached for long, or phones miss updates
    location ~ /gecko/(sw\.js|index\.html)$ { add_header Cache-Control "no-cache"; }
}

location /gecko-api/ {
    client_max_body_size 5m;          # photos are resized on the phone, so 5 MB is plenty
    proxy_pass http://127.0.0.1:8096;
    proxy_set_header Host $host;
}
