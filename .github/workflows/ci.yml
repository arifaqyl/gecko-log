name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Sync and push service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt pytest
      - run: pytest -q

  app:
    name: App script and manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The inline script in app/index.html parses
        run: |
          node -e "const h=require('fs').readFileSync('app/index.html','utf8');const js=h.split('<script>')[1].split('</script>')[0];new Function(js);console.log('index.html script: ok')"
      - name: The service worker parses
        run: node --check app/sw.js
      - name: The manifest is valid JSON with the icons it names
        run: |
          node -e "const m=require('./app/manifest.json');const fs=require('fs');for(const i of m.icons){if(!fs.existsSync('app/'+i.src))throw new Error('missing '+i.src)}console.log('manifest: ok')"
      - name: Service worker version and register URL match
        run: |
          v=$(grep -oE "gecko-v[0-9]+" app/sw.js | head -1 | sed 's/gecko-v//')
          grep -q "register('sw.js?v=$v')" app/index.html || { echo "sw.js is v$v but index.html registers a different version"; exit 1; }
          echo "service worker v$v: ok"
